context:
  version: "1.9.0"

package:
  name: tealdeer
  version: ${{ version }}

source:
  url: https://github.com/dbrgn/tealdeer/archive/v${{ version }}.tar.gz
  sha256: 1387a04ddba714668ff0925377a2de0d0ab14533d44dd0766d673fbbd71e3119

build:
  number: 0
  skip: ppc64le

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - tldr --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Very fast implementation of tldr in Rust
  homepage: https://github.com/dbrgn/tealdeer
  repository: https://github.com/dbrgn/tealdeer

extra:
  recipe-maintainers:
    - danielnachun
